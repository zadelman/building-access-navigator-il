name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Deploy only on push to main (not on pull requests)
      - name: Install paramiko
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pip install paramiko

      - name: Deploy to Hostinger via SFTP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 5
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy.py
